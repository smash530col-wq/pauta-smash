<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0F1115">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pauta">
<title>Pauta · SMASH</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Inter:wght@400;500;600&display=swap">
<style>
/* App móvil: historias a pantalla completa arriba (como Instagram), pestañas abajo.
   Oscura por defecto (se ve mejor en el celular de noche, cuando llega el informe). */
:root{
  --bg:#0F1115; --bg-2:#151821; --card:#1B1F29; --card-2:#232836; --ink:#F2F4F8; --ink-2:#A9B0BF; --ink-3:#6F7788; --line:#2A3040;
  --accent:#FF5A5F; --accent-2:#FF8A5B; --blue:#6E8BFF; --violet:#A07CFF; --good:#34D399; --warn:#FBBF24; --bad:#FF5A5F;
  --good-s:rgba(52,211,153,.14); --warn-s:rgba(251,191,36,.14); --bad-s:rgba(255,90,95,.14); --blue-s:rgba(110,139,255,.16);
  --f-head:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif; --f-body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
  color-scheme:dark;
}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){
  --bg:#F2F3F7; --bg-2:#E9EBF1; --card:#FFFFFF; --card-2:#F4F5F9; --ink:#12141A; --ink-2:#555C6B; --ink-3:#8A90A0; --line:#E1E4EB;
  --accent:#E5484D; --accent-2:#F76B15; --blue:#3E63DD; --violet:#7C5CF0; --good:#12945F; --warn:#C27C00; --bad:#D93A3F;
  --good-s:rgba(18,148,95,.12); --warn-s:rgba(194,124,0,.12); --bad-s:rgba(217,58,63,.1); --blue-s:rgba(62,99,221,.12); color-scheme:light }}
:root[data-theme="light"]{
  --bg:#F2F3F7; --bg-2:#E9EBF1; --card:#FFFFFF; --card-2:#F4F5F9; --ink:#12141A; --ink-2:#555C6B; --ink-3:#8A90A0; --line:#E1E4EB;
  --accent:#E5484D; --accent-2:#F76B15; --blue:#3E63DD; --violet:#7C5CF0; --good:#12945F; --warn:#C27C00; --bad:#D93A3F;
  --good-s:rgba(18,148,95,.12); --warn-s:rgba(194,124,0,.12); --bad-s:rgba(217,58,63,.1); --blue-s:rgba(62,99,221,.12); color-scheme:light }

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;overscroll-behavior-y:contain}
[hidden]{display:none!important}
h1,h2,h3{font-family:var(--f-head);margin:0;letter-spacing:-.01em;text-wrap:balance}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.num{font-variant-numeric:tabular-nums}
:focus-visible{outline:2.5px solid var(--blue);outline-offset:2px;border-radius:8px}
svg text{font-family:var(--f-body)}

/* ---------- inicio de sesión ---------- */
.login{min-height:100%;display:flex;flex-direction:column;justify-content:center;padding:calc(var(--safe-t) + 24px) max(20px,env(safe-area-inset-right,0px)) calc(var(--safe-b) + 24px) max(20px,env(safe-area-inset-left,0px));
  background:radial-gradient(120% 60% at 50% 0%,color-mix(in srgb,var(--violet) 28%,transparent),transparent 70%),var(--bg)}
.login-art{width:200px;height:auto;margin:0 auto 6px;display:block}
.login h1{font-size:30px;font-weight:800;text-align:center}
.login p.sub{text-align:center;color:var(--ink-2);margin:6px 0 22px}
.field{display:block;margin-bottom:12px}
.field span{display:block;font-size:13px;font-weight:600;color:var(--ink-2);margin-bottom:6px}
.field input{width:100%;font:inherit;font-size:16px;padding:14px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.field input:focus{outline:2px solid var(--blue);border-color:transparent}
.btn{width:100%;padding:15px;border-radius:14px;font-weight:700;font-size:16px;background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;box-shadow:0 10px 24px -10px var(--accent)}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.6}
.btn.ghost{background:var(--card);color:var(--bad);box-shadow:none;border:1px solid var(--line)}
.msg{min-height:1.4em;font-size:14px;margin-top:10px;text-align:center}
.msg.bad{color:var(--bad)} .msg.good{color:var(--good)}

/* ---------- estructura ---------- */
.app{min-height:100%;padding-bottom:calc(var(--safe-b) + 84px)}
.bar{position:sticky;top:0;z-index:20;padding:calc(var(--safe-t) + 10px) 16px 10px;display:flex;align-items:center;gap:10px;
  background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.bar h1{font-size:20px;font-weight:800;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.live{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--ink-2);background:var(--card);border:1px solid var(--line);padding:5px 10px;border-radius:999px}
.live i{width:8px;height:8px;border-radius:50%;background:var(--ink-3)}
.live.on i{background:var(--good);box-shadow:0 0 0 0 var(--good);animation:ping 1.8s infinite}
@keyframes ping{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--good) 60%,transparent)}100%{box-shadow:0 0 0 9px transparent}}
.date-sel{font:inherit;font-size:13px;font-weight:600;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:6px 10px;max-width:130px}
main{padding:4px 16px 0}
.view{animation:fadeUp .4s ease both}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(5,1fr);
  padding:8px max(8px,env(safe-area-inset-left,0px)) calc(var(--safe-b) + 8px);background:color-mix(in srgb,var(--bg-2) 90%,transparent);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line)}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--ink-3);padding:6px 0;border-radius:12px;position:relative}
.tab svg{width:24px;height:24px;transition:transform .25s}
.tab[aria-selected="true"]{color:var(--ink)}
.tab[aria-selected="true"] svg{transform:translateY(-2px) scale(1.08);color:var(--accent)}
.tab[aria-selected="true"]::after{content:"";position:absolute;bottom:-2px;width:18px;height:3px;border-radius:3px;background:var(--accent)}

.sec-t{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:22px 2px 10px}
.sec-t h2{font-size:18px;font-weight:800}
.sec-t span{font-size:12.5px;color:var(--ink-3)}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;margin-bottom:12px;position:relative;overflow:hidden}
.card h3{font-size:15.5px;font-weight:700}
.muted{color:var(--ink-2);font-size:13.5px}
.tiny{color:var(--ink-3);font-size:12px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:700px){main{max-width:720px;margin:0 auto}.grid2.wide{grid-template-columns:repeat(4,minmax(0,1fr))}}
.help{display:flex;gap:10px;align-items:flex-start;background:var(--blue-s);color:var(--ink);border-radius:14px;padding:10px 12px;font-size:13.5px;margin-bottom:12px}
.help svg{flex:0 0 auto;width:20px;height:20px;color:var(--blue);margin-top:1px}
body.no-help .help{display:none}

/* ---------- historias ---------- */
.stories{position:relative;height:min(68vh,560px);min-height:440px;border-radius:26px;overflow:hidden;margin-top:6px;box-shadow:0 20px 40px -24px rgba(0,0,0,.6);touch-action:pan-y;user-select:none;-webkit-user-select:none}
.st-prog{position:absolute;top:12px;left:12px;right:12px;display:flex;gap:4px;z-index:5}
.st-prog i{flex:1;height:3px;border-radius:3px;background:rgba(255,255,255,.3);overflow:hidden}
.st-prog i b{display:block;height:100%;width:0;background:#fff}
.st-prog i.done b{width:100%}
.st-prog i.run b{animation:prog var(--dur,6s) linear forwards}
.stories.paused .st-prog i.run b{animation-play-state:paused}
@keyframes prog{to{width:100%}}
.st{position:absolute;inset:0;padding:40px 22px 24px;display:flex;flex-direction:column;color:#fff;opacity:0;pointer-events:none;transition:opacity .35s}
.st.on{opacity:1;pointer-events:auto}
.st .kick{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;opacity:.85}
.st h2{font-size:clamp(26px,7.6vw,34px);font-weight:800;line-height:1.08;margin-top:8px}
.st h2 em{font-style:normal;color:#FFE08A}
.st p{margin:10px 0 0;font-size:15.5px;opacity:.92;max-width:34ch}
.st .big{font-family:var(--f-head);font-size:clamp(44px,14vw,64px);font-weight:800;line-height:1;margin-top:auto}
.st .big small{display:block;font-family:var(--f-body);font-size:14px;font-weight:500;opacity:.85;margin-top:6px}
.st .art{flex:1;display:flex;align-items:center;justify-content:center;min-height:0}
.st .art svg{width:min(78%,300px);height:auto;max-height:100%}
.st .hint{position:absolute;bottom:12px;left:0;right:0;text-align:center;font-size:11.5px;opacity:.6}
.g1{background:linear-gradient(160deg,#FF5A5F 0%,#C2185B 100%)}
.g2{background:linear-gradient(160deg,#6E8BFF 0%,#4527A0 100%)}
.g3{background:linear-gradient(160deg,#F59E0B 0%,#D9480F 100%)}
.g4{background:linear-gradient(160deg,#10B981 0%,#0F766E 100%)}
.g5{background:linear-gradient(160deg,#EC4899 0%,#7C3AED 100%)}
.g6{background:linear-gradient(160deg,#0EA5E9 0%,#1E40AF 100%)}
.g7{background:linear-gradient(160deg,#334155 0%,#0F172A 100%)}
.st-nav{position:absolute;top:0;bottom:0;width:35%;z-index:4}
.st-nav.l{left:0}.st-nav.r{right:0}

/* animaciones de ilustraciones */
.coin{animation:coin 2.4s cubic-bezier(.5,0,.6,1) infinite}
@keyframes coin{0%{transform:translateY(-60px) rotate(0);opacity:0}15%{opacity:1}80%{opacity:1}100%{transform:translateY(80px) rotate(200deg);opacity:0}}
.walk{animation:walk 3.2s linear infinite}
@keyframes walk{from{transform:translateX(-30px)}to{transform:translateX(250px)}}
.bob{animation:bob 2.6s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.heart{animation:heart 3s ease-in infinite;opacity:0}
@keyframes heart{0%{transform:translateY(40px) scale(.6);opacity:0}20%{opacity:1}100%{transform:translateY(-120px) scale(1.1);opacity:0}}
.typing circle{animation:typ 1.2s infinite}
.typing circle:nth-child(2){animation-delay:.2s}.typing circle:nth-child(3){animation-delay:.4s}
@keyframes typ{0%,60%,100%{transform:translateY(0);opacity:.5}30%{transform:translateY(-6px);opacity:1}}
.spin{animation:spin 8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.hand{animation:hand 1.6s cubic-bezier(.3,1.4,.5,1) both}
@keyframes hand{from{transform:rotate(-120deg)}to{transform:rotate(var(--a))}}
.needle{animation:needle 1.4s cubic-bezier(.2,.9,.25,1.2) both}
@keyframes needle{from{transform:rotate(-90deg)}to{transform:rotate(var(--rot))}}
.pop{animation:pop .5s cubic-bezier(.3,1.6,.5,1) both}
@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
.grow{transform-origin:left;animation:grow 1s cubic-bezier(.2,.8,.2,1) both}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.growY{transform-origin:bottom;animation:growY .9s cubic-bezier(.2,.8,.2,1) both}
@keyframes growY{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.coin,.walk,.bob,.heart,.typing circle,.spin,.hand,.needle,.pop,.growY{transform-box:fill-box;transform-origin:center}
.growY{transform-origin:bottom}
.hand,.needle{transform-box:view-box}

/* ---------- tarjetas de datos ---------- */
.kpi{padding:14px;border-radius:18px;background:var(--card);border:1px solid var(--line);min-width:0}
.kpi .ic{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;margin-bottom:8px}
.kpi .ic svg{width:19px;height:19px}
.kpi small{display:block;font-size:12px;color:var(--ink-2);font-weight:500}
.kpi b{display:block;font-family:var(--f-head);font-size:24px;font-weight:800;line-height:1.15;margin-top:2px}
.kpi.hot b{color:var(--accent)}
.c-blue{background:var(--blue-s);color:var(--blue)} .c-red{background:var(--bad-s);color:var(--bad)} .c-green{background:var(--good-s);color:var(--good)} .c-yellow{background:var(--warn-s);color:var(--warn)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;padding:4px 9px;border-radius:999px;white-space:nowrap}
.p-good{background:var(--good-s);color:var(--good)} .p-warn{background:var(--warn-s);color:var(--warn)} .p-bad{background:var(--bad-s);color:var(--bad)} .p-blue{background:var(--blue-s);color:var(--blue)}
.people{display:flex;flex-wrap:wrap;gap:3px;margin:10px 0 4px}
.people svg{width:20px;height:26px}
.ad-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.gauge{width:100%;max-width:230px;display:block;margin:6px auto 0}
.g-lbl{text-align:center;margin-top:-4px}
.g-lbl b{font-family:var(--f-head);font-size:22px;font-weight:800;display:block}
.minis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:10px}
.minis div{background:var(--card-2);border-radius:12px;padding:8px}
.minis small{display:block;font-size:11px;color:var(--ink-3)}
.minis b{font-size:13.5px}
.bar-row{display:grid;grid-template-columns:48px minmax(0,1fr) 70px;gap:8px;align-items:center;margin:7px 0}
.bar-row .tr{height:22px;border-radius:8px;background:var(--card-2);overflow:hidden;position:relative}
.bar-row .tr i{position:absolute;inset:0 auto 0 0;border-radius:8px}
.bar-row b{text-align:right;font-size:13px}
.follow-hero{display:flex;align-items:center;gap:14px}
.follow-hero svg{width:96px;height:96px;flex:0 0 auto}
.follow-hero b{font-family:var(--f-head);font-size:40px;font-weight:800;line-height:1;display:block}
.chart svg{display:block;width:100%;overflow:visible}
.axis{fill:var(--ink-3);font-size:10.5px}
.tl{display:grid;grid-template-columns:52px 18px minmax(0,1fr);gap:0 10px}
.tl .d{font-family:var(--f-head);font-weight:700;font-size:13px;text-align:right;padding-top:1px}
.tl .r{position:relative;display:flex;justify-content:center}
.tl .r::before{content:"";position:absolute;top:0;bottom:0;width:2px;background:var(--line)}
.tl:first-child .r::before{top:8px}.tl:last-child .r::before{bottom:auto;height:8px}
.tl .n{position:relative;width:12px;height:12px;border-radius:50%;border:2px solid var(--ink-3);background:var(--card);margin-top:4px}
.tl.today .n{background:var(--accent);border-color:var(--accent);box-shadow:0 0 0 5px var(--bad-s)}
.tl.past .x{opacity:.55}.tl.past .n{background:var(--ink-3)}
.tl .x{padding-bottom:16px;font-size:14px;min-width:0}
.check{display:flex;gap:12px;align-items:flex-start;padding:12px;border-radius:14px;background:var(--card-2);margin-bottom:8px;width:100%;text-align:left}
.check .bx{flex:0 0 auto;width:24px;height:24px;border-radius:8px;border:2px solid var(--ink-3);display:grid;place-items:center;transition:all .2s}
.check .bx svg{width:16px;height:16px;opacity:0;transform:scale(.4);transition:all .25s cubic-bezier(.3,1.6,.5,1)}
.check[aria-checked="true"] .bx{background:var(--good);border-color:var(--good);color:#fff}
.check[aria-checked="true"] .bx svg{opacity:1;transform:scale(1)}
.check[aria-checked="true"] span{text-decoration:line-through;opacity:.6}
.dec{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
.dec:first-of-type{border-top:0}
.dec .t{flex:0 0 auto;font-size:11.5px;font-weight:800;padding:5px 8px;border-radius:8px;min-width:72px;text-align:center}
.alert{display:flex;gap:12px;align-items:flex-start}
.alert .ai{flex:0 0 auto;width:42px;height:42px;border-radius:13px;display:grid;place-items:center}
.alert .ai svg{width:22px;height:22px}
.wheel{display:block;width:100%;max-width:300px;margin:4px auto 0}
.day-pick{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-top:10px}
.day-pick::-webkit-scrollbar{display:none}
.day-pick button{flex:0 0 auto;padding:6px 11px;border-radius:999px;background:var(--card-2);font-size:12.5px;font-weight:600;color:var(--ink-2)}
.day-pick button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.gloss details{border-top:1px solid var(--line);padding:12px 2px}
.gloss details:first-child{border-top:0}
.gloss summary{font-weight:600;cursor:pointer;list-style:none;display:flex;justify-content:space-between}
.gloss summary::-webkit-details-marker{display:none}
.gloss summary::after{content:"+";color:var(--ink-3);font-weight:700}
.gloss details[open] summary::after{content:"–"}
.gloss p{margin:8px 0 0;color:var(--ink-2);font-size:14px}
.row-btn{display:flex;align-items:center;gap:12px;width:100%;padding:14px 4px;border-top:1px solid var(--line);text-align:left;font-weight:600}
.row-btn:first-child{border-top:0}
.row-btn svg{width:22px;height:22px;color:var(--ink-2)}
.switch{margin-left:auto;width:44px;height:26px;border-radius:999px;background:var(--line);position:relative;transition:background .2s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .2s}
[aria-pressed="true"] .switch{background:var(--good)}
[aria-pressed="true"] .switch::after{transform:translateX(18px)}

/* aviso de informe nuevo */
.toast{position:fixed;left:50%;top:calc(var(--safe-t) + 12px);z-index:50;transform:translate(-50%,-140%);transition:transform .45s cubic-bezier(.3,1.4,.5,1);
  background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:700;font-size:14px;display:flex;gap:8px;align-items:center;box-shadow:0 12px 30px -10px rgba(0,0,0,.5);max-width:calc(100vw - 32px)}
.toast.on{transform:translate(-50%,0)}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:45;overflow:hidden}
.confetti i{position:absolute;top:-12px;width:8px;height:14px;border-radius:2px;animation:fall 1.8s ease-in forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(540deg)}}
.ptr{text-align:center;font-size:12.5px;color:var(--ink-3);height:0;overflow:hidden;transition:height .2s}
.state{text-align:center;padding:60px 20px}
.state svg{width:150px;height:auto;margin:0 auto 10px;display:block}
.tip{position:fixed;z-index:60;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12.5px;padding:6px 10px;border-radius:8px;opacity:0;transition:opacity .12s;max-width:220px}
.tip.on{opacity:1}
.skel{height:120px;border-radius:20px;background:linear-gradient(90deg,var(--card) 0%,var(--card-2) 50%,var(--card) 100%);background-size:200% 100%;animation:sk 1.2s infinite;margin-bottom:12px}
@keyframes sk{to{background-position:-200% 0}}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<!-- ============ inicio de sesión ============ -->
<section class="login" id="login" hidden>
  <svg class="login-art" viewBox="0 0 220 170" aria-hidden="true">
    <ellipse cx="110" cy="160" rx="80" ry="7" fill="#000" opacity=".18"/>
    <rect x="62" y="14" width="96" height="140" rx="18" fill="var(--card)" stroke="var(--ink-3)" stroke-width="3"/>
    <rect x="96" y="22" width="28" height="5" rx="2.5" fill="var(--ink-3)"/>

        bindTip(tr, "Video del " + sd(v.fecha) + ": " + int(v.vistas) + " vistas, " + int(v.interacciones) + " interacciones");
        return h("div",{class:"bar-row"},[h("b",{style:"text-align:left;font-weight:500",text:td(v.fecha)}), tr, h("b",{class:"num",text:int(v.vistas)})]);
      })).concat([tk.nota ? h("p",{class:"tiny",style:"margin:6px 0 0",text:tk.nota}) : null])));
    }
    if (R.rango) out.push(h("p",{class:"tiny",style:"margin:4px 2px",text:"Datos de Metricool, " + R.rango + "."}));
    setTimeout(function(){
      lineChart(fBox, serie.map(function(p){ return {x:p.fecha, y:p.seguidores}; }), {label:"Seguidores por día", color:"var(--accent)", short:function(v){ return nf.format(Math.round(v)); }, tip:function(p){ return sd(p.x) + ": " + int(p.y) + " seguidores"; }});
      lineChart(rv, serie.map(function(p){ return {x:p.fecha, y:p.alcance, y2:p.vistas}; }), {label:"Alcance y vistas", zero:true, color:"var(--violet)", short:function(v){ return v>=1000 ? Math.round(v/100)/10 + "k" : int(v); }, tip:function(p){ return sd(p.x) + ": " + int(p.y) + " personas · " + int(p.y2) + " vistas"; }});
    }, 0);
    return out;
  }

  // ---------- PLAN ----------
  function vPlan(d){
    var p = d.plan_semana || {}, out = [], hoy = hoyBog();
    var todo = arr(d.pendiente_camilo);
    if (todo.length){
      var key = "pauta-hecho-" + d.fecha, done = {}; try { done = JSON.parse(localStorage.getItem(key)) || {}; } catch(e){}
      out.push(secT("Lo que te toca", "toca para marcar"));
      var box = h("div",{class:"card"});
      todo.forEach(function(t,i){
        var b = h("button",{class:"check", type:"button", role:"checkbox", "aria-checked": done[i] ? "true" : "false"},[h("span",{class:"bx", html:IC.check}), h("span",{text:t})]);
        b.addEventListener("click", function(){ var on = b.getAttribute("aria-checked") !== "true"; b.setAttribute("aria-checked", on ? "true" : "false"); done[i] = on; try { localStorage.setItem(key, JSON.stringify(done)); } catch(e){} vibrate(on ? 15 : 6); if (on && Object.keys(done).filter(function(k){ return done[k]; }).length === todo.length) confetti(); });
        box.appendChild(b);
      });
      box.appendChild(h("p",{class:"tiny",style:"margin:4px 2px 0",text:"Las marcas se guardan solo en este celular."}));
      out.push(box);
    }
    var dec = arr(d.decisiones);
    if (dec.length){
      var TG = {cortar:["Cortar","p-bad"], escalar:["Subir","p-good"], cambiar:["Cambiar","p-blue"], mantener:["Mantener","p-warn"]};
      out.push(secT("Decisiones de pauta"));
      out.push(h("div",{class:"card"}, dec.map(function(x){ var t = TG[x.accion] || [x.accion, "p-blue"]; return h("div",{class:"dec"},[h("span",{class:"t pill " + t[1], text:t[0]}), h("div",{},[h("b",{style:"display:block;font-size:14.5px",text:x.que}), h("span",{class:"muted",text:x.porque})])]); })));
    }
    var dias = arr(p.dias);
    if (dias.length){
      out.push(secT("La semana", p.rango || ""));
      out.push(h("div",{class:"card"}, dias.map(function(x){
        var cls = "tl" + (x.fecha===hoy ? " today" : (x.fecha && x.fecha<hoy ? " past" : ""));
        var meta = [x.anuncio, x.segmentacion, x.presupuesto].filter(Boolean);
        return h("div",{class:cls},[h("div",{class:"d",text:x.dia}), h("div",{class:"r"},[h("i",{class:"n"})]), h("div",{class:"x"},[x.fecha===hoy ? h("span",{class:"pill p-bad",style:"margin-bottom:4px",text:"Hoy"}) : null, h("div",{text:x.texto}), meta.length ? h("div",{class:"tiny",style:"margin-top:4px",text:meta.join(" · ")}) : null])]);
      })));
    }
    if (p.ab) out.push(h("div",{class:"card"},[h("h3",{text:"Prueba de la semana"}), h("p",{class:"muted",style:"margin:6px 0 0",text:p.ab})]));
    if (p.regla) out.push(h("div",{class:"card"},[h("h3",{text:"Cuándo subir o bajar plata"}), h("p",{class:"muted",style:"margin:6px 0 0",text:p.regla})]));
    return out;
  }

  // ---------- MÁS ----------
  var GLOS = [["Costo por pedido","Lo que costó en pauta conseguir un pedido real: gasto del anuncio ÷ pedidos que trajo. Si pasa de lo que deja un pedido (unos $9.000), pierde plata."],["Chat","Una persona que tocó el anuncio y escribió. Escribir no es comprar."],["Tasa de cierre","De cada 10 que escriben, cuántas piden. 3 de 10 = 30%."],["Frecuencia","Cuántas veces la misma persona vio el anuncio. Más de 6 cansa."],["Creativo","El video o imagen del anuncio. Cuando se gasta, toca grabar otro."],["Segmentación","A quién se le muestra el anuncio: edad, sexo, zona."],["Alcance","Personas distintas que vieron tu contenido."],["Vistas","Veces que se mostró tu contenido en total."],["Prueba A/B","Correr dos versiones a la vez para saber cuál funciona mejor."],["Orgánico","Clientes que llegan sin pauta."]];
  function vMas(){
    var out = [];
    var hlp = h("button",{class:"row-btn", type:"button", "aria-pressed": document.body.classList.contains("no-help") ? "false" : "true"},[svgFrom(IC.bulb), h("span",{text:"Mostrar ayudas"}), h("span",{class:"switch"})]);
    hlp.addEventListener("click", function(){ var on = hlp.getAttribute("aria-pressed") !== "true"; hlp.setAttribute("aria-pressed", on ? "true" : "false"); document.body.classList.toggle("no-help", !on); try { localStorage.setItem("pauta-help", on ? "on" : "off"); } catch(e){} });
    var full = h("a",{class:"row-btn", href:"../", style:"color:inherit;text-decoration:none"},[svgFrom(IC.full), h("span",{text:"Ver el informe completo (página)"})]);
    out.push(secT("Ajustes")); out.push(h("div",{class:"card",style:"padding:4px 14px"},[hlp, full]));
    // instalar
    out.push(secT("Tenerla como app"));
    var inst = h("div",{class:"card"},[h("div",{style:"display:flex;gap:12px;align-items:flex-start"},[h("div",{class:"ic c-blue",style:"width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:0 0 auto", html:IC.phone}), h("div",{},[h("h3",{text:"Instálala en tu celular"}), h("p",{class:"muted",style:"margin:4px 0 0",text:"Android (Chrome): menú ⋮ → «Instalar app» o «Agregar a pantalla de inicio». iPhone (Safari): botón Compartir → «Agregar a inicio»."})])])]);
    if (deferredInstall){ var ib = h("button",{class:"btn",style:"margin-top:12px",type:"button",text:"Instalar ahora"}); ib.addEventListener("click", function(){ deferredInstall.prompt(); deferredInstall = null; ib.remove(); }); inst.appendChild(ib); }
    out.push(inst);
    // contraseña
    out.push(secT("Mi cuenta"));
    var form = h("form",{novalidate:"novalidate"},[
      h("label",{class:"field"},[h("span",{text:"Contraseña actual"}), h("input",{type:"password", id:"pwOld", autocomplete:"current-password"})]),
      h("label",{class:"field"},[h("span",{text:"Nueva contraseña (8+ con letras y números)"}), h("input",{type:"password", id:"pwNew", autocomplete:"new-password"})]),
      h("label",{class:"field"},[h("span",{text:"Repite la nueva"}), h("input",{type:"password", id:"pwNew2", autocomplete:"new-password"})]),
      h("button",{class:"btn", type:"submit", id:"pwBtn", text:"Cambiar contraseña"}), h("p",{class:"msg", id:"pwMsg", role:"status"})]);
    form.addEventListener("submit", cambiarClave);
    var outB = h("button",{class:"btn ghost", type:"button", style:"margin-top:10px", text:"Cerrar sesión"}); outB.addEventListener("click", function(){ sb.auth.signOut(); });
    out.push(h("div",{class:"card"},[h("div",{style:"display:flex;gap:10px;align-items:center;margin-bottom:8px"},[h("div",{class:"ic c-yellow",style:"width:36px;height:36px;border-radius:11px;display:grid;place-items:center", html:IC.key}), h("h3",{text:"Cambiar contraseña"})]), form, outB]));
    out.push(secT("Diccionario"));
    out.push(h("div",{class:"card gloss"}, GLOS.map(function(g){ return h("details",{},[h("summary",{text:g[0]}), h("p",{text:g[1]})]); })));
    return out;
  }

  // ---------- navegación ----------
  var TITLES = {hoy:"Hoy", anuncios:"Anuncios", redes:"Redes", plan:"Plan", mas:"Más"};
  function render(){
    clearTimeout(storyTimer); DRAW = [];
    var d = DAYS.filter(function(x){ return x.fecha === cur; })[0] || DAYS[0];
    $("barTitle").textContent = TITLES[view];
    main.textContent = "";
    if (!d && view !== "mas"){ main.appendChild(h("div",{class:"state"},[svgFrom(ART.empty), h("h3",{text:"Todavía no hay informes"}), h("p",{class:"muted",text:"El agente deja uno cada noche. Aparecerá aquí solo."})])); return; }
    var parts = view==="hoy" ? vHoy(d) : view==="anuncios" ? vAnuncios(d) : view==="redes" ? vRedes(d) : view==="plan" ? vPlan(d) : vMas();
    var wrap = h("div",{class:"view"}); parts.forEach(function(p){ if (p) wrap.appendChild(p); }); main.appendChild(wrap);
  }
  [].forEach.call(document.querySelectorAll(".tab"), function(t){
    t.addEventListener("click", function(){ view = t.getAttribute("data-v"); [].forEach.call(document.querySelectorAll(".tab"), function(x){ x.setAttribute("aria-selected", x===t ? "true" : "false"); }); vibrate(6); scrollTo({top:0}); render(); });
  });
  function fillDates(){
    var sel = $("dateSel"); sel.textContent = "";
    DAYS.slice(0,30).forEach(function(x){ sel.appendChild(h("option",{value:x.fecha, text:sd(x.fecha)})); });
    if (cur) sel.value = cur;
  }
  $("dateSel").addEventListener("change", function(){ cur = this.value; render(); });

  // ---------- avisos ----------
  var toastT;
  function toast(text){ var t = $("toast"); t.textContent = text; t.classList.add("on"); clearTimeout(toastT); toastT = setTimeout(function(){ t.classList.remove("on"); }, 3200); }
  function confetti(){
    if (REDUCED) return; var c = h("div",{class:"confetti"}), cols = ["#FF5A5F","#FBBF24","#34D399","#6E8BFF","#A07CFF"];
    for (var i=0;i<40;i++){ c.appendChild(h("i",{style:"left:" + Math.random()*100 + "%;background:" + cols[i%5] + ";animation-delay:" + Math.random()*.6 + "s;animation-duration:" + (1.4 + Math.random()) + "s"})); }
    document.body.appendChild(c); setTimeout(function(){ c.remove(); }, 3000);
  }

  // ---------- datos y sesión ----------
  if (!window.supabase){ $("login").hidden = false; $("lgMsg").textContent = "Sin conexión. Revisa tu internet y vuelve a abrir la app."; $("lgMsg").className = "msg bad"; return; }
  var sb = window.supabase.createClient(SUPA_URL, SUPA_KEY, {auth:{persistSession:true, autoRefreshToken:true, storageKey:"pauta-smash-sesion"}});
  var canal = null;
  function setLive(on, txt){ $("live").classList.toggle("on", on); $("liveTxt").textContent = txt; }
  function cargar(silencioso){
    return sb.from("pauta_dias").select("fecha,datos").order("fecha",{ascending:false}).limit(60).then(function(res){
      if (res.error){ if (!silencioso) toast("No se pudo leer el informe"); return; }
      var prevTop = DAYS[0] && DAYS[0].fecha;
      DAYS = (res.data||[]).map(function(r){ return Object.assign({}, r.datos||{}, {fecha:r.fecha}); });
      if (!cur || !DAYS.some(function(x){ return x.fecha===cur; }) || (prevTop && cur===prevTop)) cur = DAYS[0] && DAYS[0].fecha;
      fillDates(); render();
    });
  }
  function conectarVivo(){
    if (canal) sb.removeChannel(canal);
    canal = sb.channel("pauta-dias-app").on("postgres_changes",{event:"*", schema:"public", table:"pauta_dias"}, function(ev){
      var f = ev.new && ev.new.fecha;
      cargar(true).then(function(){ toast(f ? "Llegó el informe del " + sd(f) : "Informe actualizado"); vibrate([20,40,20]); confetti(); });
    }).subscribe(function(st){ setLive(st === "SUBSCRIBED", st === "SUBSCRIBED" ? "En vivo" : "Conectando"); });
  }
  // también se refresca al volver a la app
  document.addEventListener("visibilitychange", function(){ if (!document.hidden && !$("app").hidden) cargar(true); });

  // jalar hacia abajo para actualizar
  var y0 = null, ptr = $("ptr");
  addEventListener("touchstart", function(e){ y0 = (scrollY <= 0 && !e.target.closest(".stories")) ? e.touches[0].clientY : null; }, {passive:true});
  addEventListener("touchmove", function(e){ if (y0==null) return; var dy = e.touches[0].clientY - y0; ptr.style.height = Math.min(40, Math.max(0, dy/3)) + "px"; ptr.textContent = dy > 90 ? "Suelta para actualizar" : "Jala para actualizar"; }, {passive:true});
  addEventListener("touchend", function(e){ if (y0==null) return; var dy = e.changedTouches[0].clientY - y0; y0 = null; if (dy > 90){ ptr.textContent = "Actualizando…"; cargar(true).then(function(){ ptr.style.height = "0px"; toast("Datos al día"); }); } else ptr.style.height = "0px"; });

  // inicio de sesión
  function emailDe(u){ return String(u||"").trim().toLowerCase() + DOMINIO; }
  var LK = "pauta-login-intentos";
  function lk(){ try { return JSON.parse(localStorage.getItem(LK)) || {n:0,hasta:0}; } catch(e){ return {n:0,hasta:0}; } }
  function lkSave(x){ try { localStorage.setItem(LK, JSON.stringify(x)); } catch(e){} }
  function msg(id, t, bad){ var m = $(id); if (!m) return; m.textContent = t; m.className = "msg" + (bad ? " bad" : (t ? " good" : "")); }
  $("loginForm").addEventListener("submit", function(e){
    e.preventDefault();
    var L = lk(); if (L.hasta > Date.now()){ msg("lgMsg","Demasiados intentos. Espera " + Math.ceil((L.hasta-Date.now())/60000) + " min.", true); return; }
    var u = $("lgUser").value, p = $("lgPass").value;
    if (!u.trim() || !p){ msg("lgMsg","Escribe tu usuario y tu contraseña.", true); return; }
    $("lgBtn").disabled = true; msg("lgMsg","Entrando…");
    sb.auth.signInWithPassword({email:emailDe(u), password:p}).then(function(r){
      $("lgBtn").disabled = false;
      if (r.error){ L.n = (L.n||0)+1; if (L.n>=5){ L.hasta = Date.now()+5*60000; L.n = 0; } lkSave(L); msg("lgMsg", /rate|too many/i.test(r.error.message) ? "Demasiados intentos. Espera unos minutos." : "Usuario o contraseña incorrectos.", true); vibrate([30,40,30]); return; }
      lkSave({n:0,hasta:0}); $("lgPass").value = ""; vibrate(15);
    });
  });
  function cambiarClave(e){
    e.preventDefault();
    var o = $("pwOld").value, n1 = $("pwNew").value, n2 = $("pwNew2").value;
    if (n1.length < 8) return msg("pwMsg","La nueva debe tener al menos 8 caracteres.", true);
    if (!/[A-Za-z]/.test(n1) || !/\d/.test(n1)) return msg("pwMsg","Usa letras y números.", true);
    if (n1 !== n2) return msg("pwMsg","Las dos nuevas no coinciden.", true);
    if (n1 === o) return msg("pwMsg","Debe ser distinta de la actual.", true);
    $("pwBtn").disabled = true; msg("pwMsg","Guardando…");
    sb.auth.getUser().then(function(r){
      var em = r.data && r.data.user && r.data.user.email;
      if (!em){ $("pwBtn").disabled = false; return msg("pwMsg","Tu sesión venció. Vuelve a entrar.", true); }
      return sb.auth.signInWithPassword({email:em, password:o}).then(function(c){
        if (c.error){ $("pwBtn").disabled = false; return msg("pwMsg","La contraseña actual no es correcta.", true); }
        return sb.auth.updateUser({password:n1}).then(function(u){ $("pwBtn").disabled = false; if (u.error) return msg("pwMsg","No se pudo cambiar. Intenta con otra más larga.", true); e.target.reset(); msg("pwMsg","Listo: contraseña cambiada."); confetti(); vibrate(20); });
      });
    });
  }
  sb.auth.onAuthStateChange(function(ev, ses){
    if (ses){ $("login").hidden = true; $("app").hidden = false; if (ev === "SIGNED_IN" || ev === "INITIAL_SESSION"){ cargar(); conectarVivo(); } }
    else { $("app").hidden = true; $("login").hidden = false; DAYS = []; cur = null; if (canal){ sb.removeChannel(canal); canal = null; } setLive(false,"Conectando"); }
  });
  try { if (localStorage.getItem("pauta-help") === "off") document.body.classList.add("no-help"); } catch(e){}

  // app instalable
  var deferredInstall = null;
  addEventListener("beforeinstallprompt", function(e){ e.preventDefault(); deferredInstall = e; });
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(function(){});
})();
</script>
