<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Pauta y redes · SMASH</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: informe diario contado como historia. Resumen ilustrado arriba, luego capítulos:
   camino del cliente → cada chat → qué anuncio sirve → quién compra → a quién llega → redes (Metricool)
   → alertas → qué hacer. Cada capítulo trae una ayuda "Cómo leer esto" que se puede ocultar. */
:root{
  --bg:#F3F4F6; --surface:#FFFFFF; --surface-2:#F8F9FB; --ink:#111318; --ink-2:#555B69; --ink-3:#868C9B; --line:#E3E6EB;
  --accent:#E5484D; --accent-soft:#FDECEC; --blue:#3E63DD; --blue-soft:#E8EEFC; --good:#12945F; --good-soft:#E2F5EC;
  --warn:#C27C00; --warn-soft:#FCF2DA; --bad:#D93A3F; --bad-soft:#FCE7E7; --skin:#F2C9A8; --shadow:0 1px 2px rgba(16,19,24,.05),0 8px 24px -12px rgba(16,19,24,.18);
  --f-head:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:14px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1014; --surface:#171A20; --surface-2:#1D2128; --ink:#ECEEF2; --ink-2:#A6ACB8; --ink-3:#757C8A; --line:#2A2F38;
  --accent:#FF6369; --accent-soft:#3A1B1D; --blue:#7C9BFF; --blue-soft:#1C2542; --good:#3DD68C; --good-soft:#12301F;
  --warn:#FFB224; --warn-soft:#33270C; --bad:#FF6369; --bad-soft:#3A1B1D; --skin:#C99A7A; --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px -14px rgba(0,0,0,.6); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0E1014; --surface:#171A20; --surface-2:#1D2128; --ink:#ECEEF2; --ink-2:#A6ACB8; --ink-3:#757C8A; --line:#2A2F38;
  --accent:#FF6369; --accent-soft:#3A1B1D; --blue:#7C9BFF; --blue-soft:#1C2542; --good:#3DD68C; --good-soft:#12301F;
  --warn:#FFB224; --warn-soft:#33270C; --bad:#FF6369; --bad-soft:#3A1B1D; --skin:#C99A7A; --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px -14px rgba(0,0,0,.6); color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 56px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:20;background:var(--surface)}
.wrap{max-width:1180px;margin:0 auto}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--f-head);text-wrap:balance;margin:0;letter-spacing:-.01em}
a{color:var(--blue)}
button{font:inherit;color:inherit}
:focus-visible{outline:2.5px solid var(--blue);outline-offset:2px;border-radius:6px}
svg text{font-family:var(--f-body)}

/* ---------- barra superior ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:15;background:color-mix(in srgb,var(--surface) 88%,transparent);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line);
  margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding:10px max(16px,env(safe-area-inset-left,0px))}
@media (max-width:640px){.top{position:static}.brand small{display:none}}
.top-in{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:12px 16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;flex:0 0 auto}
.brand-mark{width:34px;height:34px;border-radius:10px;background:var(--ink);color:var(--surface);display:grid;place-items:center}
.brand b{display:block;font-family:var(--f-head);font-size:15px;line-height:1.1}
.brand small{display:block;font-size:12px;color:var(--ink-2)}
.days{display:flex;gap:6px;overflow-x:auto;flex:1 1 240px;min-width:0;scrollbar-width:none;padding:2px}
.days::-webkit-scrollbar{display:none}
.day-chip{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap}
.day-chip:hover{border-color:var(--ink-3)}
.day-chip[aria-current="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.help-toggle{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 6px 5px 12px;font-size:13px;font-weight:500;cursor:pointer;flex:0 0 auto}
.help-toggle .sw{width:34px;height:20px;border-radius:999px;background:var(--line);position:relative;transition:background .2s}
.help-toggle .sw::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .2s}
.help-toggle[aria-pressed="true"] .sw{background:var(--good)}
.help-toggle[aria-pressed="true"] .sw::after{transform:translateX(14px)}

/* ---------- capítulos ---------- */
section.ch{margin-top:56px}
.ch-head{display:flex;gap:14px;align-items:flex-start;margin-bottom:18px}
.ch-ico{flex:0 0 auto;width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line);color:var(--ink)}
.ch-ico svg{width:24px;height:24px}
.ch-kicker{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.ch-title{font-size:clamp(22px,3vw,30px);line-height:1.15;font-weight:800;margin-top:2px}
.ch-sub{color:var(--ink-2);margin:6px 0 0;max-width:68ch}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow);min-width:0}
.card h3{font-size:16px;font-weight:700}
.card .muted{color:var(--ink-2);font-size:13.5px}
.grid{display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}
@media (min-width:720px){.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (min-width:1000px){.g4{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media (min-width:600px) and (max-width:999px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* ayuda "cómo leer esto" */
.guide{display:flex;gap:12px;align-items:flex-start;background:var(--blue-soft);border-radius:12px;padding:12px 14px;margin-bottom:16px;font-size:14px}
.guide svg{flex:0 0 auto;width:22px;height:22px;color:var(--blue);margin-top:1px}
.guide p{margin:0}
.guide b{font-weight:600}
body.no-help .guide,body.no-help .term-def{display:none!important}
.term{display:inline-flex;align-items:center;gap:6px}
.q{width:20px;height:20px;border-radius:50%;border:1px solid var(--line);background:var(--surface-2);font-size:11.5px;font-weight:700;color:var(--ink-2);cursor:pointer;display:inline-grid;place-items:center;padding:0;flex:0 0 auto}
.q[aria-expanded="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.term-def{font-size:13px;color:var(--ink-2);background:var(--surface-2);border-radius:8px;padding:8px 10px;margin-top:8px;line-height:1.45}
.term-def[hidden]{display:none!important}

/* ---------- héroe ---------- */
.hero{display:grid;grid-template-columns:minmax(0,1fr);gap:20px;margin-top:24px;align-items:stretch}
@media (min-width:900px){.hero{grid-template-columns:minmax(0,1.25fr) minmax(0,1fr)}}
.hero-main{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:24px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:14px;min-width:0}
.hero-date{font-size:13px;color:var(--ink-2);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;white-space:nowrap}
.pill.atencion,.pill.pauta,.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.cocina,.pill.datos,.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bien,.pill.good{background:var(--good-soft);color:var(--good)}
.pill.blue{background:var(--blue-soft);color:var(--blue)}
.pill .dot-s{width:7px;height:7px;border-radius:50%;background:currentColor}
.hero h1{font-size:clamp(28px,4.4vw,46px);line-height:1.05;font-weight:800}
.hero h1 em{font-style:normal;color:var(--accent)}
.hero-lead{margin:0;color:var(--ink-2);font-size:16px;max-width:60ch}
.hero-art{background:linear-gradient(160deg,var(--surface) 0%,var(--surface-2) 100%);border:1px solid var(--line);border-radius:20px;padding:16px;display:flex;flex-direction:column;justify-content:center;min-width:0;box-shadow:var(--shadow)}
.hero-art svg{width:100%;height:auto;max-height:300px}
.hero-art .cap{font-size:13px;color:var(--ink-2);text-align:center;margin-top:6px}
.kpis{margin-top:14px}
.kpi{display:flex;flex-direction:column;gap:6px}
.kpi-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.kpi-ico{width:36px;height:36px;border-radius:10px;display:grid;place-items:center}
.kpi-ico svg{width:20px;height:20px}
.kpi-ico.c1{background:var(--blue-soft);color:var(--blue)} .kpi-ico.c2{background:var(--accent-soft);color:var(--accent)}
.kpi-ico.c3{background:var(--good-soft);color:var(--good)} .kpi-ico.c4{background:var(--warn-soft);color:var(--warn)}
.kpi-label{font-size:13px;color:var(--ink-2);font-weight:500}
.kpi-val{font-family:var(--f-head);font-size:30px;font-weight:800;line-height:1.1}
.kpi.hot .kpi-val{color:var(--accent)}
.kpi-note{font-size:12.5px;color:var(--ink-3)}

/* ---------- embudo ---------- */
.funnel{display:grid;gap:10px}
.f-step{display:grid;grid-template-columns:44px minmax(0,1fr);gap:12px;align-items:center}
.f-ico{width:44px;height:44px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line);display:grid;place-items:center;color:var(--ink-2)}
.f-ico svg{width:22px;height:22px}
.f-body{min-width:0}
.f-row{display:flex;justify-content:space-between;gap:10px;font-size:14px;margin-bottom:6px}
.f-row b{font-family:var(--f-head);font-size:18px}
.f-bar{height:14px;border-radius:999px;background:var(--surface-2);overflow:hidden}
.f-bar i{display:block;height:100%;border-radius:999px;background:var(--ink-3);transform-origin:left;animation:grow 1s cubic-bezier(.2,.8,.2,1) both}
.f-step.last .f-bar i{background:var(--accent)}
.f-drop{margin-left:56px;font-size:12.5px;color:var(--ink-3);display:flex;align-items:center;gap:6px}
.f-drop svg{width:14px;height:14px}
.split{display:grid;grid-template-columns:minmax(0,1fr);gap:12px;margin-top:6px}
@media (min-width:560px){.split{grid-template-columns:repeat(2,minmax(0,1fr))}}
.split .box{border-radius:12px;padding:14px;background:var(--surface-2)}
.split .box b{font-family:var(--f-head);font-size:24px;display:block}
.split .box.bad b{color:var(--bad)} .split .box.good b{color:var(--good)}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}

/* ---------- personas ---------- */
.people-src{display:grid;grid-template-columns:minmax(0,1fr);gap:10px;padding:14px 0;border-top:1px solid var(--line)}
.people-src:first-child{border-top:0;padding-top:0}
@media (min-width:760px){.people-src{grid-template-columns:minmax(0,240px) minmax(0,1fr) 90px;align-items:center;gap:18px}}
.people-src .nm b{display:block;font-weight:600}
.people-src .nm small{color:var(--ink-3);font-size:12.5px}
.people{display:flex;flex-wrap:wrap;gap:4px}
.person{width:22px;height:28px;color:var(--ink-3)}
.person.buy{color:var(--accent);animation:pop .45s cubic-bezier(.3,1.6,.5,1) both}
.person.cancel{color:var(--warn)}
.rate{font-family:var(--f-head);font-size:24px;font-weight:800}
@media (min-width:760px){.rate{text-align:right}}
.rate small{display:block;font-family:var(--f-body);font-size:12px;font-weight:500;color:var(--ink-3)}
.legend{display:flex;flex-wrap:wrap;gap:16px;font-size:13px;color:var(--ink-2);margin-top:12px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend .person{width:14px;height:18px;animation:none}
@keyframes pop{from{transform:scale(.3);opacity:.2}to{transform:scale(1);opacity:1}}

/* ---------- anuncios / medidor ---------- */
.ad{display:flex;flex-direction:column;gap:10px}
.ad-h{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.ad-h h3{font-size:15px;line-height:1.3}
.gauge{width:100%;max-width:260px;margin:4px auto 0;display:block}
.gauge .needle{transform-origin:130px 130px;animation:needle 1.2s cubic-bezier(.2,.8,.2,1) both}
@keyframes needle{from{transform:rotate(-90deg)}to{transform:rotate(var(--rot))}}
.g-val{text-align:center;margin-top:-6px}
.g-val b{display:block;font-family:var(--f-head);font-size:24px;font-weight:800}
.g-val span{font-size:12.5px;color:var(--ink-2)}
.ad-meta{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.ad-meta div{background:var(--surface-2);border-radius:10px;padding:8px 10px}
.ad-meta small{display:block;font-size:11.5px;color:var(--ink-3)}
.ad-meta b{font-size:14px}
.ad p{margin:0;font-size:13.5px;color:var(--ink-2)}
.follow-art{display:flex;align-items:center;justify-content:center;padding:8px 0}
.follow-art svg{width:120px;height:auto}

/* ---------- quién compra ---------- */
.who-art{display:flex;align-items:center;gap:14px;margin-bottom:10px}
.who-art svg{width:64px;height:64px;flex:0 0 auto}
.list{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.list li{display:flex;gap:10px;align-items:flex-start;font-size:14.5px}
.list li::before{content:"";flex:0 0 auto;width:8px;height:8px;border-radius:50%;background:var(--good);margin-top:.5em}
.obj{display:grid;gap:6px}
.obj-row{display:flex;justify-content:space-between;gap:10px;font-size:14px}
.obj-row b{font-family:var(--f-head);white-space:nowrap}
.obj-bar{height:10px;border-radius:999px;background:var(--surface-2);overflow:hidden}
.obj-bar i{display:block;height:100%;background:var(--bad);border-radius:999px;transform-origin:left;animation:grow 1s .2s cubic-bezier(.2,.8,.2,1) both}
.unknown{margin-top:14px;font-size:13px;color:var(--ink-2);display:flex;gap:8px;align-items:flex-start}
.unknown svg{width:18px;height:18px;flex:0 0 auto;color:var(--ink-3)}

/* ---------- segmentación ---------- */
.age{display:grid;gap:10px;margin-top:12px}
.age-row{display:grid;grid-template-columns:52px minmax(0,1fr) 84px;gap:10px;align-items:center}
.age-row .lb{font-weight:600;font-size:14px}
.age-track{height:26px;background:var(--surface-2);border-radius:8px;position:relative;overflow:hidden}
.age-track i{position:absolute;inset:0 auto 0 0;border-radius:8px;background:var(--ink-3);transform-origin:left;animation:grow 1s cubic-bezier(.2,.8,.2,1) both}
.age-track i.best{background:var(--good)} .age-track i.worst{background:var(--bad)}
.age-track span{position:absolute;left:10px;top:50%;transform:translateY(-50%);font-size:12px;font-weight:600;color:var(--bad)}
.age-row .v{text-align:right;font-weight:600;font-size:14px}
.age-row .v small{display:block;font-weight:400;color:var(--ink-3);font-size:11.5px}
.donut-wrap{display:flex;align-items:center;gap:18px;flex-wrap:wrap;margin-top:10px}
.donut{width:130px;height:130px;flex:0 0 auto}
.donut circle{transition:stroke-dasharray 1s}
.d-leg{display:grid;gap:10px;flex:1 1 160px;min-width:0}
.d-leg div{display:flex;align-items:center;gap:8px;font-size:14px}
.d-leg i{width:10px;height:10px;border-radius:3px;flex:0 0 auto}
.d-leg b{margin-left:auto;font-weight:600}
.wk{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:16px}
.wk div{background:var(--surface-2);border-radius:10px;padding:10px}
.wk small{display:block;font-size:11.5px;color:var(--ink-3)}
.wk b{font-size:14.5px}
.wk .same{font-size:11.5px;color:var(--ink-2)}

/* ---------- redes ---------- */
.big-follow{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap}
.big-follow b{font-family:var(--f-head);font-size:42px;font-weight:800;line-height:1}
.chart{width:100%;min-height:180px;position:relative}
.chart svg{display:block;width:100%;overflow:visible}
.chart .axis{fill:var(--ink-3);font-size:11px}
.chart .grid-l{stroke:var(--line);stroke-width:1}
.tip{position:fixed;z-index:30;pointer-events:none;background:var(--ink);color:var(--surface);font-size:12.5px;line-height:1.4;padding:7px 10px;border-radius:8px;box-shadow:var(--shadow);max-width:220px;opacity:0;transition:opacity .12s}
.tip.on{opacity:1}
.content-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(54px,1fr));gap:6px;margin-top:12px}
.c-day{background:var(--surface-2);border-radius:10px;padding:8px 6px;text-align:center;min-width:0}
.c-day small{display:block;font-size:11px;color:var(--ink-3)}
.c-day .ics{display:flex;justify-content:center;gap:3px;flex-wrap:wrap;margin-top:6px;min-height:18px}
.c-day .ics svg{width:16px;height:16px}
.c-day.empty .ics{color:var(--ink-3);font-size:11px}
.heat{display:grid;gap:3px;margin-top:12px;overflow-x:auto}
.heat-row{display:grid;grid-template-columns:38px repeat(var(--cols),minmax(18px,1fr));gap:3px;align-items:center;min-width:330px}
.heat-row .lb{font-size:12px;color:var(--ink-2);font-weight:500}
.heat-cell{height:24px;border-radius:5px;position:relative}
.heat-cell.best::after{content:"★";position:absolute;inset:0;display:grid;place-items:center;font-size:12px;color:#fff}
.heat-h{font-size:10.5px;color:var(--ink-3);text-align:center}
.tt-video{display:grid;gap:8px;margin-top:12px}
.tt-row{display:grid;grid-template-columns:64px minmax(0,1fr) 64px;gap:10px;align-items:center;font-size:13px}
.tt-bar{height:18px;background:var(--surface-2);border-radius:6px;overflow:hidden}
.tt-bar i{display:block;height:100%;background:var(--blue);border-radius:6px;transform-origin:left;animation:grow 1s cubic-bezier(.2,.8,.2,1) both}
.tt-row b{text-align:right}

/* ---------- alertas ---------- */
.alert{display:flex;gap:14px;align-items:flex-start}
.alert .a-ico{flex:0 0 auto;width:46px;height:46px;border-radius:12px;display:grid;place-items:center}
.alert .a-ico svg{width:24px;height:24px}
.alert.atencion .a-ico{background:var(--accent-soft);color:var(--accent)}
.alert.cocina .a-ico{background:var(--warn-soft);color:var(--warn)}
.alert.pagina .a-ico{background:var(--blue-soft);color:var(--blue)}
.alert.pauta .a-ico,.alert.datos .a-ico{background:var(--surface-2);color:var(--ink-2)}
.alert h3{font-size:15px;margin-bottom:4px}
.alert p{margin:0;font-size:14px;color:var(--ink-2)}

/* ---------- qué hacer ---------- */
.dec{display:flex;gap:14px;align-items:flex-start}
.dec .d-tag{flex:0 0 auto;font-size:12px;font-weight:700;padding:6px 10px;border-radius:8px;min-width:84px;text-align:center}
.dec.cortar .d-tag{background:var(--bad-soft);color:var(--bad)}
.dec.escalar .d-tag{background:var(--good-soft);color:var(--good)}
.dec.cambiar .d-tag{background:var(--blue-soft);color:var(--blue)}
.dec.mantener .d-tag{background:var(--warn-soft);color:var(--warn)}
.dec b{display:block;font-weight:600}
.dec span{font-size:13.5px;color:var(--ink-2)}
.timeline{display:grid;gap:0;margin-top:6px}
.tl{display:grid;grid-template-columns:72px 24px minmax(0,1fr);gap:0 12px}
.tl .d{font-family:var(--f-head);font-weight:700;font-size:14px;padding-top:2px;text-align:right}
.tl .rail{position:relative;display:flex;justify-content:center}
.tl .rail::before{content:"";position:absolute;top:0;bottom:0;width:2px;background:var(--line)}
.tl:first-child .rail::before{top:10px}
.tl:last-child .rail::before{bottom:auto;height:10px}
.tl .node{position:relative;width:14px;height:14px;border-radius:50%;background:var(--surface);border:2px solid var(--ink-3);margin-top:4px}
.tl.today .node{background:var(--accent);border-color:var(--accent);box-shadow:0 0 0 5px var(--accent-soft)}
.tl.past .node{background:var(--ink-3)}
.tl.past .tx{opacity:.6}
.tl .tx{padding-bottom:18px;font-size:14px;min-width:0}
.tl .tx .meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.tl .tx .meta span{font-size:12px;background:var(--surface-2);border-radius:6px;padding:3px 8px;color:var(--ink-2)}
.todo{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.todo li{display:flex;gap:10px;align-items:flex-start;font-size:14.5px;padding:10px 12px;border-radius:10px;background:var(--surface-2)}
.todo li svg{flex:0 0 auto;width:20px;height:20px;color:var(--accent);margin-top:1px}

/* ---------- glosario y pie ---------- */
.glossary{display:grid;gap:8px}
.glossary details{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.glossary summary{cursor:pointer;font-weight:600;list-style:none;display:flex;justify-content:space-between;gap:10px}
.glossary summary::-webkit-details-marker{display:none}
.glossary summary::after{content:"+";font-weight:700;color:var(--ink-3)}
.glossary details[open] summary::after{content:"–"}
.glossary p{margin:8px 0 0;color:var(--ink-2);font-size:14px}
.foot{margin-top:40px;padding-top:18px;border-top:1px solid var(--line);display:grid;gap:10px;font-size:13.5px;color:var(--ink-2)}
.gap{background:var(--warn-soft);border-radius:12px;padding:12px 14px;color:var(--ink)}
.banner{margin-top:14px;background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:10px 14px;font-size:13.5px;color:var(--ink-2)}
.state{margin:72px auto;max-width:460px;text-align:center}
.state svg{width:120px;height:auto;margin:0 auto 12px;display:block}
.state h2{font-size:22px}
.state p{color:var(--ink-2)}
.note{font-size:12.5px;color:var(--ink-3);margin-top:10px}

/* ---------- ilustración héroe ---------- */
.bub{animation:bub .5s cubic-bezier(.3,1.5,.5,1) both}
.b1{animation-delay:.2s}.b2{animation-delay:.5s}.b3{animation-delay:.8s}.b4{animation-delay:1.1s}
@keyframes bub{from{transform:translateY(8px) scale(.85);opacity:0}to{transform:none;opacity:1}}
.float{animation:float 4s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.bub,.float{transform-box:fill-box;transform-origin:center}

/* ---------- base de página propia (fuera de Claude) ---------- */
html{color-scheme:light}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}

/* ---------- inicio de sesión y cuenta ---------- */
.login{min-height:100vh;display:grid;place-items:center;padding-block:32px}
.login-card{width:100%;max-width:380px;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:28px 24px;box-shadow:var(--shadow);text-align:left}
.login-art svg{width:110px;height:auto;display:block;margin:0 auto 8px}
.login h1{font-size:26px;font-weight:800;text-align:center}
.login-sub{text-align:center;color:var(--ink-2);margin:6px 0 18px}
.login-foot{font-size:12.5px;color:var(--ink-3);text-align:center;margin:14px 0 0}
form label{display:block;font-size:13px;font-weight:600;margin:12px 0 6px}
form input{width:100%;font:inherit;font-size:16px;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink)}
form input:focus{outline:2px solid var(--blue);outline-offset:1px;border-color:transparent}
.btn{display:block;width:100%;margin-top:16px;padding:12px;border:0;border-radius:10px;background:var(--ink);color:var(--surface);font-weight:700;cursor:pointer}
.btn:disabled{opacity:.6;cursor:wait}
.btn.ghost{background:transparent;color:var(--bad);border:1px solid var(--line);margin-top:12px}
.f-msg{min-height:1.4em;font-size:13.5px;margin:10px 0 0}
.f-msg.bad{color:var(--bad)} .f-msg.good{color:var(--good)}
.acct-btn{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer;flex:0 0 auto}
.top{position:sticky}
.acct{position:absolute;right:max(16px,env(safe-area-inset-right,0px));top:calc(100% + 8px);width:min(340px,calc(100vw - 32px));background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--shadow);z-index:25}
.acct-h{display:flex;justify-content:space-between;align-items:center}
@media (max-width:640px){.top{position:relative}}
.live-dot{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--ink-2);border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 10px;flex:0 0 auto}
.live-dot i{width:8px;height:8px;border-radius:50%;background:var(--ink-3)}
.live-dot.on i{background:var(--good);animation:livep 1.8s infinite}

@keyframes fadeUp{from{opacity:0;transform:translate(-50%,-10px)}to{opacity:1;transform:translate(-50%,0)}}

</header>

<main class="wrap" id="app">

</main>
</div>

<div class="live-toast" id="liveToast" role="status" aria-live="polite" hidden></div>

  // ---------- datos (Supabase) ----------
  // Clave pública (publishable): está hecha para ir en la página. Quién puede leer lo decide
  // la base de datos: solo el usuario autorizado ve los informes.
  var SUPA_URL = "https://tjcylrjdpwwimzppslja.supabase.co", SUPA_KEY = "sb_publishable_UHEGlmqlIMZC3F5zIYuDcQ_xi-UCgBF";
  var DOMINIO = "@pauta-smash.local";   // el usuario se guarda en Supabase como usuario@pauta-smash.local
  var loginBox = document.getElementById("login"), shell = document.getElementById("shell");
  var acctBtn = document.getElementById("acctBtn"), acct = document.getElementById("acct");
  if (!window.supabase || !window.supabase.createClient){ showLogin("No se pudo cargar el sistema de inicio de sesión. Revisa tu internet y recarga la página."); return; }
  var sb = window.supabase.createClient(SUPA_URL, SUPA_KEY, {auth:{persistSession:true, autoRefreshToken:true, storageKey:"pauta-smash-sesion"}});

  function showLogin(msg){ shell.hidden = true; loginBox.hidden = false; setMsg("loginMsg", msg || "", !!msg); var u = document.getElementById("lgUser"); if (u && !msg) u.focus(); }
  function showShell(){ loginBox.hidden = true; shell.hidden = false; }
  function setMsg(id, text, bad){ var m = document.getElementById(id); m.textContent = text; m.className = "f-msg" + (bad ? " bad" : (text ? " good" : "")); }
  function emailDe(u){ return String(u||"").trim().toLowerCase() + DOMINIO; }

  // protección extra: tras 5 intentos fallidos, se bloquea este navegador por 5 minutos
  var LOCK_KEY = "pauta-login-intentos";
  function lockInfo(){ try { return JSON.parse(localStorage.getItem(LOCK_KEY)) || {n:0, hasta:0}; } catch(e){ return {n:0, hasta:0}; } }
  function lockSave(x){ try { localStorage.setItem(LOCK_KEY, JSON.stringify(x)); } catch(e){} }

  function cargar(){
    var timer = setTimeout(function(){ if (!DAYS.length) showState("Sin señal todavía","No se pudo leer el informe. Revisa la conexión y vuelve a abrir la página."); }, 10000);
    sb.from("pauta_dias").select("fecha,datos,actualizado").order("fecha",{ascending:false}).limit(90).then(function(res){
      clearTimeout(timer);
      if (res.error){ showState("Algo falló","No se pudo leer el informe. Intenta de nuevo en un momento."); return; }
      DAYS = (res.data || []).map(function(r){ return Object.assign({}, r.datos || {}, {fecha:r.fecha}); });
      if (!DAYS.length){ showState("Todavía no hay informes","Esta cuenta no tiene informes para ver todavía. El agente deja uno cada noche."); return; }
      var want = location.hash.slice(1);
      if (!current || !DAYS.some(function(x){return x.fecha===current;})) current = DAYS.some(function(x){return x.fecha===want;}) ? want : DAYS[0].fecha;
      render();
    });
  }

  document.getElementById("loginForm").addEventListener("submit", function(e){
    e.preventDefault();
    var L = lockInfo();
    if (L.hasta > Date.now()){ setMsg("loginMsg","Demasiados intentos. Espera " + Math.ceil((L.hasta-Date.now())/60000) + " min y vuelve a intentar.", true); return; }
    var u = document.getElementById("lgUser").value, p = document.getElementById("lgPass").value;
    if (!u.trim() || !p){ setMsg("loginMsg","Escribe tu usuario y tu contraseña.", true); return; }
    var btn = document.getElementById("lgBtn"); btn.disabled = true; setMsg("loginMsg","Entrando…", false);
    sb.auth.signInWithPassword({email:emailDe(u), password:p}).then(function(res){
      btn.disabled = false;
      if (res.error){
        L.n = (L.n||0) + 1; if (L.n >= 5){ L.hasta = Date.now() + 5*60000; L.n = 0; }
        lockSave(L);
        setMsg("loginMsg", /rate|too many/i.test(res.error.message) ? "Demasiados intentos. Espera unos minutos." : "Usuario o contraseña incorrectos.", true);
        return;
      }
      lockSave({n:0, hasta:0});
      document.getElementById("lgPass").value = "";
    });
  });

  // cuenta: cambiar contraseña y salir
  acctBtn.addEventListener("click", function(){ var o = acct.hidden; acct.hidden = !o; acctBtn.setAttribute("aria-expanded", o ? "true" : "false"); if (o) document.getElementById("pwOld").focus(); });
  document.getElementById("acctClose").addEventListener("click", function(){ acct.hidden = true; acctBtn.setAttribute("aria-expanded","false"); });
  document.getElementById("logout").addEventListener("click", function(){ sb.auth.signOut(); acct.hidden = true; });
  document.getElementById("pwForm").addEventListener("submit", function(e){
    e.preventDefault();
    var oldP = document.getElementById("pwOld").value, n1 = document.getElementById("pwNew").value, n2 = document.getElementById("pwNew2").value;
    if (n1.length < 8){ setMsg("pwMsg","La nueva contraseña debe tener al menos 8 caracteres.", true); return; }
    if (!/[A-Za-z]/.test(n1) || !/\d/.test(n1)){ setMsg("pwMsg","Usa letras y números en la nueva contraseña.", true); return; }
    if (n1 !== n2){ setMsg("pwMsg","Las dos contraseñas nuevas no coinciden.", true); return; }
    if (n1 === oldP){ setMsg("pwMsg","La nueva contraseña debe ser distinta de la actual.", true); return; }
    var btn = document.getElementById("pwBtn"); btn.disabled = true; setMsg("pwMsg","Guardando…", false);
    sb.auth.getUser().then(function(r){
      var email = r.data && r.data.user && r.data.user.email;
      if (!email){ btn.disabled = false; setMsg("pwMsg","Tu sesión venció. Vuelve a entrar.", true); return; }
      // confirma la contraseña actual antes de cambiarla
      return sb.auth.signInWithPassword({email:email, password:oldP}).then(function(chk){
        if (chk.error){ btn.disabled = false; setMsg("pwMsg","La contraseña actual no es correcta.", true); return; }
        return sb.auth.updateUser({password:n1}).then(function(up){
          btn.disabled = false;
          if (up.error){ setMsg("pwMsg", /weak|short|least/i.test(up.error.message) ? "Esa contraseña es muy débil. Prueba una más larga." : "No se pudo cambiar la contraseña. Intenta de nuevo.", true); return; }
          document.getElementById("pwForm").reset();
          setMsg("pwMsg","Listo: tu contraseña quedó cambiada.", false);
        });
      });
    });
  });

  // tiempo real: cuando llega o cambia un informe, la página se actualiza sola (igual que la app del celular)
  var canal = null;
  function conectarVivo(){
    if (canal) sb.removeChannel(canal);
    canal = sb.channel("pauta-dias-web").on("postgres_changes",{event:"*", schema:"public", table:"pauta_dias"}, function(ev){
      var f = ev.new && ev.new.fecha;
      if (f && (current === (DAYS[0] && DAYS[0].fecha))) current = null;   // si estabas en el más nuevo, salta al que llegó
      cargar();
      var t = document.getElementById("liveToast"); t.textContent = f ? "Llegó el informe del " + shortDate(f) : "Informe actualizado"; t.hidden = false;
      clearTimeout(conectarVivo.t); conectarVivo.t = setTimeout(function(){ t.hidden = true; }, 4000);
    }).subscribe(function(st){ document.getElementById("liveDot").classList.toggle("on", st === "SUBSCRIBED"); });
  }

  sb.auth.onAuthStateChange(function(ev, session){
    if (session){ showShell(); if (ev === "SIGNED_IN" || ev === "INITIAL_SESSION"){ cargar(); conectarVivo(); } }
    else { DAYS = []; current = null; app.textContent = ""; daysNav.textContent = ""; if (canal){ sb.removeChannel(canal); canal = null; } showLogin(); }
  });
  document.addEventListener("visibilitychange", function(){ if (!document.hidden && !shell.hidden) cargar(); });
})();
</script>
</body>
</html>
